<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintHarbor slicer</title>
<!-- The slicer front end comes from FlashBridge (Prepare / Paint / Preview); PrintHarbor
     runs the slicing with OrcaSlicer on this computer (internal/api/slicerui.go). -->
<link rel="stylesheet" href="fb.css">
<link rel="stylesheet" href="host.css">
<script type="importmap">{"imports": {"three": "./vendor/three.module.js", "fflate": "./vendor/fflate.js"}}</script>
</head>
<body class="in-slicer">
  <header class="sl-bar">
    <label class="sl-pick"><span class="muted small">Printer</span><select id="ph-printer"></select></label>
    <nav class="mode-tabs" id="mode-tabs" aria-label="Slicer screens">
      <a href="#slicer/prepare" data-mode="prepare" class="sl-tab" title="Slicer: place models on the plate"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.6 8 12 11.7 5.4 8 12 4.3zM5 9.7l6 3.4v6.6l-6-3.4V9.7zm8 10v-6.6l6-3.4v6.6l-6 3.4z"/></svg><span>Prepare</span></a>
      <a href="#slicer/paint" data-mode="paint" class="sl-tab" title="Slicer: paint colours onto models"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.7 4.6 19.4 3.3a1 1 0 0 0-1.4 0L9 12.3l2.7 2.7 9-9a1 1 0 0 0 0-1.4zM7 14c-1.7 0-3 1.3-3 3 0 1.3-1.2 2-2 2 .9 1.2 2.5 2 4 2 2.2 0 4-1.8 4-4 0-1.7-1.3-3-3-3z"/></svg><span>Paint</span></a>
      <a href="#slicer/preview" data-mode="preview" class="sl-tab" title="Slicer: slice and preview layer by layer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="m12 16.5-8-4.4L2 13.2l10 5.6 10-5.6-2-1.1-8 4.4zm0-3.6L2 7.4 12 2l10 5.4-10 5.5zm0 7.6-8-4.4L2 17.2 12 22.7l10-5.5-2-1.1-8 4.4z"/></svg><span>Preview</span></a>
    </nav>
    <span class="sl-bar-sp"></span>
    <div class="ph-project" id="ph-project"></div>
    <button class="btn small" type="button" id="ph-add" title="Add STL, OBJ or 3MF files from this computer">Add model</button>
  </header>
  <main>
    <section class="view active" id="view-slicer">
      <div id="sl-setup" class="hidden"></div>
      <div class="sl-wrap" id="sl-wrap">
        <div class="sl-stage" id="sl-stage">
          <div class="sl-tools" id="sl-tools"></div>
          <div class="sl-plates" id="sl-plates" aria-label="Plates"></div>
          <div class="sl-hint" id="sl-hint"></div>
          <div class="sl-empty hidden" id="sl-empty">
            <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.6 8 12 11.7 5.4 8 12 4.3zM5 9.7l6 3.4v6.6l-6-3.4V9.7zm8 10v-6.6l6-3.4v6.6l-6 3.4z"/></svg>
            <b>Drop a model here</b>
            <span>STL, OBJ or 3MF (also MakerWorld / Bambu / Orca projects)</span>
            <button class="btn primary" type="button" data-sl="add">Add a model</button>
          </div>
          <div class="sl-drop hidden" id="sl-drop"><b>Drop to add to the plate</b></div>
          <div class="sl-layers hidden" id="sl-layers">
            <span class="sl-layer-n" id="sl-layer-n"></span>
            <input type="range" id="sl-layer" min="1" max="1" value="1" aria-label="Layer">
            <span class="sl-layer-z" id="sl-layer-z"></span>
          </div>
          <div class="sl-legend hidden" id="sl-legend"></div>
          <div class="sl-busy hidden" id="sl-busy">
            <div class="sl-busy-card">
              <b id="sl-busy-title">Slicing…</b>
              <div class="progress"><div id="sl-busy-bar"></div></div>
              <div class="small muted" id="sl-busy-msg"></div>
              <button class="btn small" type="button" id="sl-busy-cancel">Cancel</button>
            </div>
          </div>
        </div>
        <aside class="sl-side" id="sl-side"></aside>
      </div>
      <input type="file" id="sl-file" accept=".stl,.obj,.3mf" multiple hidden>
    </section>
  </main>
  <dialog id="sl-all-dialog" class="sheet wide">
    <div class="sheet-head">
      <h2>All print settings</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <div class="row gap wrap sl-all-bar">
      <input type="search" id="sl-all-search" placeholder="Search settings (e.g. ironing, seam, speed)">
      <label class="check"><input type="checkbox" id="sl-all-changed"> Only changed</label>
    </div>
    <div id="sl-all-list" class="sl-all-list"></div>
  </dialog>
  <dialog id="confirm-dialog" class="small-dialog">
    <form method="dialog" class="stack">
      <h2 id="cf-title">Are you sure?</h2>
      <p id="cf-text" class="muted"></p>
      <div class="row gap end">
        <button class="btn" value="no">Cancel</button>
        <button class="btn danger" value="yes" id="cf-yes">Yes</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="host.js"></script>
</body>
</html>
